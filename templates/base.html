<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}CyberSentinel WAF Demo{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="brand">🛡️ CyberSentinel</div>
        <nav>
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('login') }}">Login</a>
            <a href="{{ url_for('search') }}">Search</a>
            <a href="{{ url_for('fetch') }}">Fetch File</a>
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
        </nav>
    </header>

    <main class="content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>CyberSentinel &mdash; a student mini-project WAF. Not for production use.</p>
    </footer>
</body>
</html>
